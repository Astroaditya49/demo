<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Field Shift Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<style>
  body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
  #side { width: 330px; padding: 14px; overflow: auto; background: #f5f7f5; }
  #map { flex: 1; }
  label { font-size: 13px; font-weight: bold; }
  input, select, button { width: 100%; margin: 4px 0 10px; padding: 8px; box-sizing: border-box; }
  button { background: #1a9850; color: white; border: none; font-size: 15px; cursor: pointer; }
  #info { margin: 10px 0; font-weight: bold; }
</style>
</head>
<body>

<div id="side">
  <h3>Field Shift Viewer</h3>
  <p style="font-size:13px">Map par click karo, ya latitude/longitude likho.</p>

  <label>Latitude</label>
  <input id="lat" value="19.09">
  <label>Longitude</label>
  <input id="lon" value="74.74">
  <label>Start date</label>
  <input id="start" type="date" value="2026-08-01">
  <label>End date</label>
  <input id="end" type="date" value="2026-10-31">
  <label>Kya dekhna hai?</label>
  <select id="layer">
    <option value="ndvi">NDVI (fasal ki sehat)</option>
    <option value="lst">Land Surface Temp (°C)</option>
    <option value="rain">Baarish (mm)</option>
  </select>

  <button onclick="run()">Show data</button>
  <div id="info"></div>
  <canvas id="chart"></canvas>
</div>

<div id="map"></div>

<script>
const API = "http://127.0.0.1:8000";

const map = L.map("map").setView([19.09, 74.74], 9);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            { attribution: "Tiles © Esri", maxZoom: 18 }).addTo(map);

L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
            { maxZoom: 18, zIndex: 5 }).addTo(map);

let marker = null, geeLayer = null, chart = null;
const $ = (id) => document.getElementById(id);

map.on("click", (e) => {
  $("lat").value = e.latlng.lat.toFixed(4);
  $("lon").value = e.latlng.lng.toFixed(4);
  if (marker) map.removeLayer(marker);
  marker = L.marker(e.latlng).addTo(map);
});

async function run() {
  const info = $("info");
  info.textContent = "Loading... (5-15 second lag sakte hain)";

  const q = `lat=${$("lat").value}&lon=${$("lon").value}` +
            `&start=${$("start").value}&end=${$("end").value}`;

  try {
    // 1) Earth Engine map layer
    const gRes = await fetch(`${API}/api/gee/map?${q}&layer=${$("layer").value}`);
    const g = await gRes.json();
    if (g.detail) throw new Error(g.detail);

    if (geeLayer) map.removeLayer(geeLayer);
    geeLayer = L.tileLayer(g.tile_url, { opacity: 0.75 }).addTo(map);
    map.setView([$("lat").value, $("lon").value], 10);
    if (marker) map.removeLayer(marker);
    marker = L.marker([$("lat").value, $("lon").value]).addTo(map);

    info.textContent = "Average: " + (g.mean != null ? g.mean.toFixed(2) : "n/a");

    // 2) NASA POWER chart
    const pRes = await fetch(`${API}/api/power?${q}&params=T2M,PRECTOTCORR`);
    const p = await pRes.json();
    if (p.detail) throw new Error(p.detail);

    const days = Object.keys(p.T2M);
    if (chart) chart.destroy();
    chart = new Chart($("chart"), {
      data: {
        labels: days.map(d => d.slice(6) + "/" + d.slice(4, 6)),
        datasets: [
          { type: "line", label: "Temp (°C)", data: days.map(d => p.T2M[d]),
            borderColor: "#d73027", yAxisID: "y" },
          { type: "bar", label: "Rain (mm)", data: days.map(d => p.PRECTOTCORR[d]),
            backgroundColor: "#74add1", yAxisID: "y1" }
        ]
      },
      options: {
        scales: {
          y:  { position: "left",  title: { display: true, text: "°C" } },
          y1: { position: "right", title: { display: true, text: "mm" },
                grid: { drawOnChartArea: false } }
        }
      }
    });
  } catch (err) {
    info.textContent = "Error: " + err.message;
  }
}
</script>
</body>
</html>
